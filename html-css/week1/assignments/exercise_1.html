<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jovine Jestas K</title>

    <link rel="stylesheet" href="./exercise_1.css" />
  </head>

  <body>
    <main class="main_div">
      <header class="header">
        <h1 class="header-title">Product Table</h1>
        <h3 class="header-subtitle">List of some snacks</h3>
      </header>

      <table class="table">
        <caption>
          Available Products
        </caption>

        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>In Stock</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Chocolate Bar</td>
            <td>20 DKK</td>
            <td>Yes</td>
          </tr>

          <tr>
            <td>Potato Chips</td>
            <td>25 DKK</td>
            <td>Yes</td>
          </tr>

          <tr>
            <td>Cookies</td>
            <td>30 DKK</td>
            <td>No</td>
          </tr>
        </tbody>
      </table>

      <div class="button_parent">
        <button class="button">Hi, Click me!</button>
      </div>
    </main>
  </body>
</html>
